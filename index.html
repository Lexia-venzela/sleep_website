<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>수면 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: system-ui,sans-serif;
            max-width: 760px;
            margin: auto;
            padding: 16px
        }

        nav button {
            padding: 8px 12px;
            margin: 2px;
            cursor: pointer
        }

        section {
            display: none;
            margin-top: 16px
        }

            section.on {
                display: block
            }

        label {
            display: block;
            margin: 8px 0
        }

        input, select {
            padding: 6px
        }

        .box {
            background: #f3f6fb;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px
        }
    </style>
</head>
<body>
    <h1>🌙 나의 수면 관리</h1>
    <nav>
        <button data-t="rec">권장 수면</button>
        <button data-t="log">오늘 기록</button>
        <button data-t="focus">수면·집중도</button>
        <button data-t="stress">수면·스트레스</button>
        <button data-t="alarm">알림</button>
    </nav>

    <section id="rec" class="on">
        <h2>오늘의 권장 수면 시간</h2>
        <label>나이 <input id="age" type="number" value="22"></label>
        <label>오늘 카페인 음료 (잔/캔) <input id="caf" type="number" value="1" min="0"></label>
        <label>
            내일 필요한 집중도
            <select id="need">
                <option value="1">낮음</option>
                <option value="3" selected>보통</option>
                <option value="5">매우 높음 (시험·발표)</option>
            </select>
        </label>
        <label>내일 기상 시각 <input id="wake" type="time" value="07:00"></label>
        <button id="calc">계산</button>
        <div id="recOut" class="box"></div>
    </section>

    <section id="log">
        <h2>오늘 기록 입력</h2>
        <label>날짜 <input id="d" type="date"></label>
        <label>수면 시간(시간) <input id="sh" type="number" step="0.1"></label>
        <label>PVT 반응시간(ms) <input id="pvt" type="number"></label>
        <label>Stroop 반응시간(ms) <input id="stroop" type="number"></label>
        <label>Forerunner 스트레스(0~100) <input id="st" type="number" min="0" max="100"></label>
        <button id="save">저장</button> <span id="msg"></span>
    </section>

    <section id="focus">
        <h2>최근 7일: 수면 vs 집중도</h2>
        <canvas id="c1"></canvas><div id="r1" class="box"></div>
    </section>

    <section id="stress">
        <h2>최근 7일: 수면 vs 스트레스</h2>
        <canvas id="c2"></canvas><div id="r2" class="box"></div>
    </section>

    <section id="alarm">
        <h2>수면 알림</h2>
        <label>알림 시각 <input id="atime" type="time" value="23:00"></label>
        <button id="aset">브라우저 알림 켜기</button>
        <button id="aics">캘린더 알림 파일(.ics) 받기</button>
        <p class="box">
            브라우저 알림은 <b>이 페이지가 열려 있을 때만</b> 작동합니다.
            항상 받으려면 .ics 파일을 휴대폰 캘린더에 추가하세요.
        </p>
    </section>

    <p style="font-size:12px;color:#777">※ 참고용 정보이며 의학적 진단이 아닙니다. 기록은 이 기기의 브라우저에만 저장됩니다.</p>
    <script src="app.js"></script>
</body>
</html>
